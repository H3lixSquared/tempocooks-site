<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  /* Fonts are bundled with the app and sit next to this file. */
  @font-face { font-family:"Bricolage Grotesque"; font-weight:800; src:url("BricolageGrotesque-ExtraBold.ttf"); }
  @font-face { font-family:"Bricolage Grotesque"; font-weight:600; src:url("BricolageGrotesque-SemiBold.ttf"); }
  html, body { margin:0; padding:0; background:transparent; -webkit-user-select:none; overflow:hidden; }
  #stage svg { display:block; width:100%; height:auto; overflow:visible; }
  /* Caption strip scales with the width: always exactly 14vw tall. */
  #cap { display:flex; align-items:center; gap:2vw; padding:0 1vw; height:14vw; box-sizing:border-box; overflow:hidden;
    font-family:"Bricolage Grotesque"; font-weight:800; font-size:4.6vw; line-height:1.1; color:#151515; }
  #cap .dot { flex:none; display:inline-grid; place-items:center; min-width:7vw; height:7vw; padding:0 1.8vw; border-radius:999px; border:2.5px solid #151515; background:#F49AC1; font-size:3.6vw; box-sizing:border-box; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="wobble"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter></svg>
<div id="stage"></div><div id="cap"></div>
<script>
// ---------- tiny animation kit ----------
const INK = "#151515";
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = (p) => p * p * (3 - 2 * p);
const lerp = (a, b, p) => a + (b - a) * p;
const st = (w = 4.5, extra = "") => `stroke="${INK}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}`;

// A chef's knife lying along an angle. Tip at (x,y), pointing in direction `deg`.
function knife(x, y, deg, len = 120) {
  return `<g transform="translate(${x} ${y}) rotate(${deg})">
    <path d="M0 0 L${-len} -9 L${-len} 7 Z" fill="#E3E7EA" ${st(3.5)}/>
    <path d="M${-len + 4} -1 L-8 -1" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>
    <rect x="${-len - 52}" y="-8" width="54" height="16" rx="6" fill="#3B2A1E" ${st(3.5)}/>
    <g transform="translate(${-len - 28} 0)">${fist()}</g></g>`;
}
// Cartoon glove fist (Just Hands), centered on the handle.
function fist() {
  return `<path d="M-16 -14 C-16 -20 -10 -22 -4 -22 L12 -22 C18 -22 20 -16 20 -10 L20 8 C20 14 16 16 10 16 L-8 16 C-14 16 -16 12 -16 6 Z" fill="#fff" ${st(3.5)}/>
    <path d="M-8 -12 L-8 8 M2 -12 L2 8 M11 -12 L11 6" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`;
}
function board() {
  return `<rect x="18" y="38" width="324" height="196" rx="18" fill="#E8C49A" ${st(4)}/>
          <path d="M40 62 L320 62 M40 210 L320 210" stroke="#D3AC7E" stroke-width="3" stroke-linecap="round"/>`;
}

// A sticker label with a little pointer line, so anyone knows what the food is.
function label(x, y, text, toX, toY, color = "#F7C94B") {
  const w = text.length * 9.4 + 26;
  return `<path d="M${x} ${y} L${toX} ${toY}" ${st(3)} fill="none"/>
    <g transform="translate(${x} ${y}) rotate(-3)"><rect x="${-w / 2}" y="-15" width="${w}" height="28" rx="14" fill="${color}" ${st(3)}/>
    <text y="5" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="16" fill="${INK}">${text}</text></g>`;
}
// Flat open glove resting on top of food (side view).
function flatHand(x, y) {
  return `<g transform="translate(${x} ${y})"><path d="M-46 0 C-46 -12 -30 -16 -10 -16 L30 -16 C44 -16 48 -8 46 0 Z" fill="#fff" ${st(3.5)}/>
    <path d="M-30 -8 L22 -8" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M30 -16 C40 -30 70 -40 96 -46" ${st(14)}/><path d="M30 -16 C40 -30 70 -40 96 -46" stroke="#7FB4F0" stroke-width="8" stroke-linecap="round"/></g>`;
}

// ---------- 1. Dice an onion ----------
const onion = {
  title: "Dice an onion", dur: 14,
  why: "Keeping the root on holds the layers together, so every cut makes neat little cubes.",
  captions: [[0, "1", "Cut it in half, right through the root"], [2.6, "2", "Peel off the papery skin"],
             [4.2, "3", "Flat side down. Slice the long way, but stop before the root"],
             [6.6, "4", "Turn the knife flat. Make 2 cuts toward the root"], [9.2, "5", "Now slice across"], [12.3, "✓", "Diced!"]],
  draw(t) {
    const cx = 180, cy = 136, rx = 104, ry = 70, rootX = cx - rx;
    let s = board();
    // --- 1. whole onion, cut through the root
    if (t < 2.6) {
      const split = ease(seg(t, 1.6, 2.2)) * 30, fade = 1 - seg(t, 2.1, 2.6);
      for (const dir of [-1, 1]) {
        s += `<g transform="translate(0 ${dir * split})" opacity="${dir < 0 ? fade : 1}"><clipPath id="h${dir}"><rect x="0" y="${dir < 0 ? 0 : cy}" width="400" height="${dir < 0 ? cy : 400}"/></clipPath>
          <g clip-path="url(#h${dir})"><path d="M${cx - 92} ${cy} C${cx - 92} ${cy - 92} ${cx + 70} ${cy - 92} ${cx + 100} ${cy} C${cx + 70} ${cy + 92} ${cx - 92} ${cy + 92} ${cx - 92} ${cy} Z" fill="#E7B46A" ${st()}/>
          <path d="M${cx - 70} ${cy - 40} C${cx - 20} ${cy - 66} ${cx + 40} ${cy - 56} ${cx + 80} ${cy - 18} M${cx - 70} ${cy + 40} C${cx - 20} ${cy + 66} ${cx + 40} ${cy + 56} ${cx + 80} ${cy + 18} M${cx - 80} ${cy} L${cx + 92} ${cy}" stroke="#C48A3E" stroke-width="2.6" fill="none"/></g></g>`;
      }
      // root hairs and the pointy top
      s += `<path d="M${cx - 92} ${cy - 10} l-14 -8 M${cx - 92} ${cy} l-18 0 M${cx - 92} ${cy + 10} l-14 8" ${st(2.6)}/>
            <path d="M${cx + 100} ${cy} L${cx + 124} ${cy - 6} L${cx + 120} ${cy + 4} Z" fill="#C48A3E" ${st(3)}/>`;
      if (t < 1.4) s += label(92, 22 + 20, "Onion", 130, 78);
      const k = ease(seg(t, 0.5, 1.6));
      s += knife(lerp(cx + 280, cx + 110, k), cy, 180);
      if (t > 1.1) s += `<path d="M${cx + 100} ${cy} L${lerp(cx + 100, cx - 92, seg(t, 1.1, 1.6))} ${cy}" stroke="${INK}" stroke-width="3" stroke-dasharray="6 6"/>`;
      return s;
    }
    const rows = [-44, -22, 0, 22, 44];
    const colsX = [250, 222, 194, 166, 138, 110];
    // --- 4. side view for the flat cuts
    if (t >= 6.6 && t < 9.2) {
      s = `<rect x="18" y="186" width="324" height="26" rx="8" fill="#E8C49A" ${st(4)}/>`;
      s += `<path d="M70 186 C70 90 290 90 300 186 Z" fill="#F4E6F1" ${st()}/>`;
      for (const f of [0.75, 0.5]) s += `<path d="M${lerp(185, 70, f)} 186 C${lerp(185, 70, f)} ${186 - 96 * f} ${lerp(185, 300, f)} ${186 - 96 * f} ${lerp(185, 300, f)} 186" fill="none" stroke="#D8B9D2" stroke-width="2.5"/>`;
      s += `<path d="M70 176 L56 172 M70 182 L52 184" ${st(2.6)}/><text x="44" y="166" font-family="Bricolage Grotesque" font-weight="800" font-size="14" text-anchor="middle">root</text>`;
      s += flatHand(150, 116);
      const cutYs = [158, 132];
      const i = clamp(Math.floor((t - 6.8) / 1.1), 0, 1), p = ((t - 6.8) / 1.1) % 1;
      for (let c = 0; c < 2; c++) {
        const done = t > 6.8 + (c + 1) * 1.1 - 0.35;
        if (done || c < i) s += `<path d="M110 ${cutYs[c]} L300 ${cutYs[c]}" stroke="${INK}" stroke-width="2.6"/>`;
      }
      const tip = lerp(370, 108, ease(clamp(p * 1.5)));
      s += knife(tip, cutYs[i], 180, 120);
      s += `<g transform="translate(86 36)"><rect x="-56" y="-16" width="112" height="30" rx="15" fill="#7FB4F0" ${st(3)}/><text y="5" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="15">side view</text></g>`;
      return s;
    }
    // --- top view of the half
    const appear = ease(seg(t, 2.6, 3.0));
    const lenCuts = Math.floor(clamp((t - 4.4) / 0.42, 0, rows.length));
    const crossCuts = Math.floor(clamp((t - 9.3) / 0.42, 0, colsX.length));
    const flatCutsShown = t >= 9.2;
    s += `<clipPath id="half"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/></clipPath>`;
    s += `<path d="M${rootX + 4} ${cy - 14} C${rootX - 14} ${cy - 10} ${rootX - 14} ${cy + 10} ${rootX + 4} ${cy + 14}" fill="#D9C4A0" ${st(3.5)} opacity="${appear}"/>`;
    const solidRight = crossCuts > 0 ? colsX[crossCuts - 1] : cx + rx + 4;
    s += `<g clip-path="url(#half)" opacity="${appear}"><rect x="0" y="0" width="${solidRight}" height="400" fill="#F4E6F1"/>
      ${[0.72, 0.5, 0.28].map(f => `<ellipse cx="${rootX}" cy="${cy}" rx="${rx * 2 * f + 20}" ry="${ry * f + 8}" fill="none" stroke="#D8B9D2" stroke-width="2.5"/>`).join("")}
      ${rows.slice(0, lenCuts).map(y => `<path d="M${rootX + 28} ${cy + y} L${solidRight} ${cy + y}" stroke="${INK}" stroke-width="2.6"/>`).join("")}
    </g><clipPath id="leftOf"><rect x="0" y="0" width="${solidRight}" height="400"/></clipPath>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" ${st()} opacity="${appear}" clip-path="url(#leftOf)"/>`;
    // --- 2. the papery skin peels away
    if (t < 4.2) {
      const peel = ease(seg(t, 3.0, 4.0));
      s += `<g transform="translate(${peel * 140} ${-peel * 90}) rotate(${peel * 50} ${cx} ${cy})" opacity="${1 - peel}">
        <ellipse cx="${cx}" cy="${cy}" rx="${rx + 4}" ry="${ry + 4}" fill="#E7B46A" ${st()}/>
        <path d="M${rootX + 20} ${cy - 30} C${cx} ${cy - 60} ${cx + 60} ${cy - 40} ${cx + 96} ${cy - 10} M${rootX + 20} ${cy + 30} C${cx} ${cy + 60} ${cx + 60} ${cy + 40} ${cx + 96} ${cy + 10}" stroke="#C48A3E" stroke-width="2.6" fill="none"/></g>`;
      if (t > 3.0 && t < 4.0) s += label(300, 52, "skin", 270, 90, "#fff");
    }
    // --- cubes from each finished cross cut
    const edges = [cx + rx, ...colsX];
    for (let c = 0; c < crossCuts; c++) {
      const x0 = edges[c + 1], x1 = edges[c];
      const yEdges = [-ry, ...rows, ry];
      for (let r = 0; r < yEdges.length - 1; r++) {
        const midX = (x0 + x1) / 2, midY = cy + (yEdges[r] + yEdges[r + 1]) / 2;
        if (((midX - cx) / rx) ** 2 + ((midY - cy) / ry) ** 2 >= 0.92) continue;
        const jig = Math.sin(c * 7 + r * 3) * 3;
        const settle = ease(seg(t, 9.3 + c * 0.42 + 0.2, 9.3 + c * 0.42 + 0.6));
        const dx = settle * (8 + c * 3) + jig, w = Math.min(24, x1 - x0 - 3), h = Math.min(19, yEdges[r + 1] - yEdges[r] - 3);
        s += `<rect x="${midX - w / 2 + dx}" y="${midY - h / 2 + jig * 0.6}" width="${w}" height="${h}" rx="4" fill="#F4E6F1" ${st(2.6)} transform="rotate(${jig * 2} ${midX + dx} ${midY})"/>`;
      }
    }
    if (t >= 4.4 && t < 6.6) {
      const i = clamp(Math.floor((t - 4.4) / 0.42), 0, rows.length - 1), p = ((t - 4.4) / 0.42) % 1;
      s += knife(lerp(cx + rx + 40, rootX + 28, ease(clamp(p * 1.6))), cy + rows[i], 180, 120);
      if (t > 6.1) s += label(120, 50, "root stays on", rootX + 6, cy - 20);
    } else if (t >= 9.3 && t < 12.0) {
      const i = clamp(Math.floor((t - 9.3) / 0.42), 0, colsX.length - 1), p = ((t - 9.3) / 0.42) % 1;
      s += knife(colsX[i], lerp(cy - ry - 50, cy + ry + 10, ease(clamp(p * 1.7))), 90, 150);
    }
    if (t > 12.3) {
      const pop = ease(seg(t, 12.3, 12.7));
      s += `<g transform="translate(296 66) scale(${pop})"><circle r="24" fill="#8FD18A" ${st(3.5)}/><path d="M-10 0 L-3 8 L11 -8" fill="none" ${st(4.5)}/></g>`;
    }
    return s;
  },
};

// ---------- 2. Mince garlic ----------
const garlic = {
  title: "Mince garlic", dur: 7,
  why: "Smashing first loosens the skin and makes the clove easy to chop small.",
  captions: [[0, "1", "Lay the flat of the knife on the clove and press"], [2.2, "2", "The skin slips right off"], [3.6, "3", "Rock the knife until it's tiny"]],
  draw(t) {
    let s = board();
    const cx = 180, cy = 140;
    const press = t < 2.2 ? ease(seg(t, 0.6, 1.3)) : 1;
    const peeled = t > 2.2;
    const chopped = seg(t, 3.6, 6.4);
    if (chopped < 0.05) {
      // the clove, squashing under the knife
      const sq = 1 - press * 0.35, wide = 1 + press * 0.25;
      if (!peeled || t < 3.0) {
        const skinOff = ease(seg(t, 2.2, 3.0));
        s += `<g transform="translate(${cx} ${cy}) scale(${wide} ${sq})"><path d="M-40 18 C-44 -10 -20 -34 6 -34 C34 -34 46 -6 40 18 Z" fill="${peeled ? "#FFF3C8" : "#F6EEDB"}" ${st()}/>
          ${peeled ? "" : `<path d="M-20 -20 C-10 -8 -10 6 -16 16 M14 -24 C20 -10 18 6 12 16" stroke="#D6C9A8" stroke-width="2.5" fill="none"/>`}</g>`;
        if (peeled) s += `<g transform="translate(${cx + 70 * skinOff} ${cy - 60 * skinOff}) rotate(${skinOff * 120})" opacity="${1 - skinOff * 0.6}">
          <path d="M-28 6 C-22 -16 10 -22 28 -8 C14 -2 -6 6 -28 6 Z" fill="#F6EEDB" ${st(3)}/></g>`;
      } else {
        s += `<g transform="translate(${cx} ${cy}) scale(1.25 0.65)"><path d="M-40 18 C-44 -10 -20 -34 6 -34 C34 -34 46 -6 40 18 Z" fill="#FFF3C8" ${st()}/></g>`;
      }
      if (t < 0.7) s += label(262, 220, "Garlic clove", 206, 162);
      if (t < 2.2) {
        // flat of the blade from above, with the glove pushing down
        const y = cy - 30 + press * 10;
        s += `<g transform="translate(${cx} ${y})"><rect x="-120" y="-30" width="210" height="48" rx="10" fill="#E3E7EA" ${st(3.5)}/>
          <rect x="90" y="-18" width="66" height="26" rx="8" fill="#3B2A1E" ${st(3.5)}/>
          <g transform="translate(-10 ${-36 + press * 8}) scale(1.5)">${fist()}</g>
          ${press > 0.6 ? `<path d="M-90 40 L-104 52 M90 40 L104 52 M0 44 L0 60" ${st(3.5)} fill="none"/>` : ""}</g>`;
      }
    } else {
      // tiny bits growing as the knife rocks over them
      const n = Math.floor(6 + chopped * 34);
      for (let i = 0; i < n; i++) {
        const a = i * 2.39996, r = Math.sqrt(i) * 9 * (0.6 + chopped * 0.6);
        const x = cx + Math.cos(a) * r * 1.5, y = cy + Math.sin(a) * r * 0.8;
        const size = lerp(20, 7, chopped);
        s += `<rect x="${x - size / 2}" y="${y - size / 2}" width="${size}" height="${size * 0.8}" rx="3" fill="#FFF3C8" ${st(2.4)} transform="rotate(${i * 37} ${x} ${y})"/>`;
      }
      // side-ish rocking knife: tip pinned, handle bobbing
      const rock = Math.sin(t * 14) * 10, sweep = Math.sin(t * 2.2) * 40;
      s += knife(cx - 80, cy - 4, 180 + rock + sweep * 0.1, 170);
    }
    return s;
  },
};

// ---------- 3. Simmer vs boil ----------
const bubbles = {
  title: "Simmer vs. boil", dur: 4,
  why: "Most recipes want a simmer, and a boil can make sauces split or meat tough.",
  captions: [[0, "", "Simmer: small, lazy bubbles. Boil: big ones that never stop"]],
  draw(t) {
    let s = "";
    const pot = (x, label, color, rolling) => {
      let g = `<g transform="translate(${x} 0)">
        <path d="M14 70 L146 70 L138 214 L22 214 Z" fill="#fff" ${st()}/>
        <path d="M6 70 L154 70" ${st(5)}/>`;
      // water with a moving surface
      const amp = rolling ? 6 : 1.5;
      let surf = `M20 ${100}`;
      for (let i = 0; i <= 12; i++) surf += ` L${20 + i * 10} ${100 + Math.sin(t * (rolling ? 11 : 3) + i * 1.3) * amp}`;
      g += `<path d="${surf} L136 212 L24 212 Z" fill="#BFE0F7" stroke="none"/><path d="${surf}" fill="none" ${st(3)}/>`;
      const count = rolling ? 16 : 4, speed = rolling ? 70 : 18;
      for (let i = 0; i < count; i++) {
        const phase = (t * speed / 100 + i / count) % 1;
        const bx = 34 + ((i * 53) % 92) + Math.sin(t * 4 + i) * (rolling ? 4 : 1);
        const by = 206 - phase * 104, r = rolling ? lerp(4, 11, phase) : lerp(2, 4, phase);
        g += `<circle cx="${bx}" cy="${by}" r="${r}" fill="#fff" ${st(2.4)}/>`;
      }
      if (rolling) for (let i = 0; i < 3; i++) {
        const p = (t * 0.9 + i / 3) % 1;
        g += `<path d="M${50 + i * 30} ${60 - p * 40} c-6-8 6-12 0-20" fill="none" ${st(3.5)} opacity="${1 - p}"/>`;
      }
      // burner flame: small vs big
      const fl = rolling ? 1 : 0.45;
      for (let i = 0; i < 5; i++) {
        const fx = 40 + i * 20, h = (16 + Math.sin(t * 9 + i * 2) * 4) * fl;
        g += `<path d="M${fx - 6} 230 Q${fx} ${230 - h * 2} ${fx + 6} 230 Z" fill="${color}" ${st(2.5)}/>`;
      }
      g += `<g transform="translate(80 36)"><rect x="-56" y="-18" width="112" height="32" rx="16" fill="${rolling ? "#F0643C" : "#8FD18A"}" ${st(3)}/>
        <text y="5" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="18" fill="${rolling ? "#fff" : INK}">${label}</text></g></g>`;
      return g;
    };
    return pot(14, "Simmer", "#7FB4F0", false) + pot(196, "Boil", "#F0643C", true);
  },
};

// ---------- 4. Ready to flip? (side view) ----------
const flip = {
  title: "Is it ready to flip?", dur: 10,
  why: "Meat sticks until a crust forms, then lets go by itself. Forcing it early tears the crust off.",
  captions: [[0, "1", "Give the pan a little shake. Stuck to the pan? Not yet"], [2.6, "2", "Wait a minute. The crust is still forming"],
             [4.0, "3", "Shake again. It slides around? It's ready"], [6.4, "4", "Flip it. See that golden crust?"]],
  draw(t) {
    let s = "";
    const shake1 = t < 2.4 ? Math.sin(seg(t, 0.4, 2.2) * Math.PI * 6) * 14 * (t > 0.4 && t < 2.2 ? 1 : 0) : 0;
    const shake2 = t >= 4.0 && t < 6.2 ? Math.sin(seg(t, 4.2, 6.0) * Math.PI * 6) * 14 * (t > 4.2 && t < 6.0 ? 1 : 0) : 0;
    const panX = shake1 + shake2;
    // burner
    for (let i = 0; i < 6; i++) { const fx = 100 + i * 32, h = 14 + Math.sin(t * 9 + i * 2) * 4; s += `<path d="M${fx - 7} 222 Q${fx} ${222 - h * 1.6} ${fx + 7} 222 Z" fill="#7FB4F0" ${st(2.5)}/>`; }
    s += `<path d="M30 206 L330 206" ${st(4)}/>`;
    // pan moves with the shake
    s += `<g transform="translate(${panX} 0)"><path d="M60 180 C60 200 300 200 300 180 L304 170 L56 170 Z" fill="#4A4A4A" ${st()}/>
      <path d="M300 176 L352 154" ${st(9)}/><path d="M300 176 L352 154" stroke="#3B2A1E" stroke-width="5" stroke-linecap="round"/></g>`;
    // the chicken: stuck pieces ride along with the pan, free pieces slide and lag behind
    const browned = clamp(seg(t, 0, 4.0) * 0.6 + seg(t, 3.0, 4.0) * 0.4);
    const under = `rgb(${Math.round(lerp(232, 200, browned))},${Math.round(lerp(201, 130, browned))},${Math.round(lerp(160, 47, browned))})`;
    let cx = 180 + (t < 4 ? panX : -shake2 * 1.6), cy = 156, rot = 0;
    if (t >= 6.4) {
      const p = ease(seg(t, 6.6, 7.8));
      cx = 180 + Math.sin(p * Math.PI) * 6; cy = 156 - Math.sin(p * Math.PI) * 82; rot = p * 180;
    }
    const flipped = rot > 90;
    s += `<g transform="translate(${cx} ${cy}) rotate(${rot})"><path d="M-44 6 C-46 -12 -20 -18 0 -16 C26 -18 46 -10 44 6 C40 14 -40 14 -44 6 Z" fill="#F2DDBF" ${st()}/>
      <path d="M-42 6 C-40 14 40 14 44 6 L44 10 C40 18 -40 18 -44 10 Z" fill="${under}" ${st(3)}/></g>`;
    if (flipped && t > 7.8) s += `<path d="M150 ${cy - 22} l-6 -10 M180 ${cy - 26} l0 -12 M210 ${cy - 22} l6 -10" ${st(3)}/>`;
    // stuck: little glue marks; free: motion lines
    if (t < 2.4 && t > 0.4) s += `<path d="M150 170 l0 6 M170 170 l0 6 M190 170 l0 6 M210 170 l0 6" ${st(3)} transform="translate(${panX} 0)" stroke="#F0643C"/>`;
    if (t >= 4.2 && t < 6.0) s += `<path d="M${cx - 64} 150 l-16 0 M${cx - 64} 160 l-22 0 M${cx + 64} 150 l16 0 M${cx + 64} 160 l22 0" ${st(3)}/>`;
    // spatula only for the flip
    if (t >= 6.0) {
      const inP = ease(seg(t, 6.0, 6.6)), outP = ease(seg(t, 7.8, 8.6));
      const spX = lerp(340, 196, inP) + outP * 150, lift = t > 6.6 && t < 7.8 ? -Math.sin(seg(t, 6.6, 7.8) * Math.PI) * 24 : 0;

/// A cut piece: cube, coin, strip, bit, shred, chunk.
function piece(F, kind, x, y, rot = 0, size = 1) {
  const inner = F.inner, outer = F.fill;
  const tf = `transform="translate(${x} ${y}) rotate(${rot}) scale(${size})"`;
  if (F.type === "leafy") return `<path ${tf} d="M-6 0 C-6 -8 6 -8 6 0 C6 8 -6 8 -6 0 Z" fill="${kind === "bit" ? outer : inner}" ${st(2)}/>`;
  if (F.type === "tree" && kind !== "bit") return `<g ${tf}><path d="M-3 2 L-3 10 L3 10 L3 2" fill="${inner}" ${st(2)}/><circle cx="0" cy="-2" r="8" fill="${outer}" ${st(2.4)}/></g>`;
  switch (kind) {
    case "cube": return `<g ${tf}><rect x="-10" y="-8" width="20" height="16" rx="3" fill="${inner}" ${st(2.6)}/>${F.type === "slab" || F.type === "round" ? `<path d="M-8 -6 L8 -6" stroke="${outer}" stroke-width="3" stroke-linecap="round"/>` : ""}</g>`;
    case "coin": return `<g ${tf}><ellipse rx="13" ry="10" fill="${outer}" ${st(2.6)}/><ellipse rx="9" ry="7" fill="${inner}"/>${F.seedsLong || F.seeds ? `<circle r="2.4" fill="${shade(inner)}"/>` : ""}${F.rings ? `<ellipse rx="5" ry="4" fill="none" stroke="${F.rings}" stroke-width="2"/>` : ""}</g>`;
    case "strip": return `<g ${tf}><rect x="-20" y="-5" width="40" height="10" rx="4" fill="${inner}" ${st(2.4)}/><path d="M-18 -4 L18 -4" stroke="${outer}" stroke-width="3" stroke-linecap="round"/></g>`;
    case "bit": return `<rect ${tf} x="-3.5" y="-3" width="7" height="6" rx="1.5" fill="${inner}" stroke="${INK}" stroke-width="1.6"/>`;
    case "shred": return `<path ${tf} d="M-13 -1 C-6 -6 6 3 13 -2 L13 2 C6 7 -6 -2 -13 3 Z" fill="${inner === "#FBF8EE" || inner === "#FBF1D4" ? outer : inner}" stroke="${INK}" stroke-width="1.4" stroke-linejoin="round"/>`;
    case "chunk": return `<path ${tf} d="M-12 -8 L8 -11 L13 4 L2 11 L-11 7 Z" fill="${inner}" ${st(2.6)}/>`;
    case "wedge": return `<path ${tf} d="M-14 8 C-14 -10 14 -10 14 8 Z" fill="${outer}" ${st(2.6)}/>`;
  }
  return "";
}

// A cut piece of meat (cube or strip) that goes from raw to golden.
function bit(F, shape, x, y, rot, cooked) {
  const raw = F.inner || F.fill, done = F.cooked || "#D99A5B";
  const color = mixColor(raw.startsWith("#") ? raw : "#F4C9C0", done, clamp(cooked));
  const edge = mixColor(raw.startsWith("#") ? raw : "#F4C9C0", "#B8743A", clamp(cooked));
  const tf = `transform="translate(${x} ${y}) rotate(${rot})"`;
  if (shape === "strip") return `<g ${tf}><rect x="-17" y="-5" width="34" height="10" rx="4" fill="${color}" ${st(2.4)}/><path d="M-14 -3 L14 -3" stroke="${edge}" stroke-width="2.5" stroke-linecap="round" opacity=".8"/></g>`;

// Small color helpers.
function hexToRgb(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mixColor(a, b, q) { const x = hexToRgb(a), y = hexToRgb(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], q))).join(",")})`; }
function shade(h) { if (!h.startsWith("#")) return h; const c = hexToRgb(h); return `rgb(${c.map(v => Math.round(v * 0.78)).join(",")})`; }
// Which piece each food naturally cuts into for slicing.
function sliceKind(F) { return ["round", "long", "mushroom"].includes(F.type) ? "coin" : F.type === "leafy" ? "bit" : "strip"; }

const sizzle = (t, cx, cy, w) => [0, 1, 2, 3].map(i => { const p = (t * 2 + i / 4) % 1, x = cx - w / 2 + (i + 0.5) * w / 4; return `<path d="M${x} ${cy - 6 - p * 18} l${i % 2 ? 4 : -4} -6" ${st(2.6)} opacity="${1 - p}"/>`; }).join("");

  <path d="M40 124 C26 124 26 144 42 142 M320 124 C334 124 334 144 318 142" fill="none" ${st(4)}/>${inner}`;

  <path d="M300 160 L352 138" ${st(9)}/><path d="M300 160 L352 138" stroke="#3B2A1E" stroke-width="5" stroke-linecap="round"/>`;

  // Cut-up meat browning in the pan: pieces sizzle and slowly go golden,

  brownbits: { dur: 4, draw(t, F, shape = "cube") {

      : [[96, 158, 8], [124, 154, -10], [152, 160, 14], [180, 155, -4], [208, 159, 20], [236, 156, -16], [262, 160, 6], [110, 167, -6], [140, 168, 10], [170, 168, -12], [200, 167, 4], [230, 168, -8], [256, 167, 12]];

    });
    s += sizzle(t, 180, 150, 190) + steam(t, [140, 200, 250], 112, 0.5);

  // Turning cut-up meat: a spatula sweeps under, the pieces tumble over and

  turnbits: { dur: 2.4, draw(t, F, shape = "cube") {

    const p = t / 2.4;

      ? [[100, 158, 8], [140, 155, -6], [180, 160, 4], [220, 156, -10], [258, 159, 6], [124, 167, -4], [168, 168, 10], [212, 167, -8], [248, 168, 2]]
      : [[100, 158, 8], [128, 154, -10], [156, 160, 14], [184, 155, -4], [212, 159, 20], [240, 156, -16], [264, 160, 6], [114, 167, -6], [144, 168, 10], [174, 168, -12], [204, 167, 4], [234, 168, -8]];
    // The spatula sweeps left to right; each piece flips as it passes.

};

/// Builds a demo for "action:food", e.g. "dice:chicken" or "pour:milk".
// ---------- General scenes: work for any food, or none ----------
// A bite-sized piece of whatever's cooking; unknown food shows a colorful mix.
const MIX = ["#F08A3C", "#8CC152", "#E8503C", "#F7C94B", "#D99A5B"];
function morsel(F, i, x, y, r, cooked = 0.7) {
  if (!F || F === FOODS.food) return `<path transform="translate(${x} ${y}) rotate(${r})" d="M-11 -7 L8 -10 L12 4 L2 10 L-10 6 Z" fill="${MIX[i % MIX.length]}" ${st(2.4)}/>`;
  if (F.type === "slab") return bit(F, "cube", x, y, r, cooked);
  return piece(F, "chunk", x, y, r);
}
const plate = (x, y, s = 1) => `<g ${at(x, y, s)}><ellipse rx="62" ry="15" fill="#fff" ${st()}/><ellipse rx="40" ry="8" fill="none" stroke="#E4E0D6" stroke-width="3"/></g>`;
const spatula = (x, y, r = -24) => `<g ${at(x, y, 1, r)}><path d="M-24 0 L24 0 L26 -7 L-22 -7 Z" fill="#D9DEE2" ${st(3)}/><path d="M24 -4 L76 -44" ${st(6)}/></g>`;
const PAN_SPOTS = [[100, 158], [130, 154], [160, 160], [190, 155], [220, 159], [250, 156], [116, 167], [146, 168], [176, 168], [206, 167], [236, 168]];

Object.assign(ACTIONS, {
  // Food cooking in a skillet, stirred now and then: the everyday stove scene.
  panfood: { dur: 2.4, draw(t, F) {
    let s = burner(t) + panSide();
    const stir = Math.sin(t / 2.4 * Math.PI * 2);
    PAN_SPOTS.forEach(([x, y], i) => { s += morsel(F, i, x + stir * ((i % 3) - 1) * 4, y - Math.abs(Math.sin(t * 7 + i)) * 2, i * 47 + stir * 10); });
    s += sizzle(t, 180, 150, 190) + steam(t, [140, 210, 250], 112, 0.5);
    return s + spatula(200 + stir * 50, 140, -20 + stir * 8);
  } },
  // "Return the chicken to the skillet": a plate tips and the food slides in.
  intopan: { dur: 2.6, draw(t, F) {
    let s = burner(t) + panSide();
    const p = t / 2.6, tip = ease(clamp(p / 0.35)), slide = clamp((p - 0.3) / 0.45);
    PAN_SPOTS.slice(0, 5).forEach(([x, y], i) => { s += morsel(FOODS.food === F ? F : FOODS.food, i + 2, x + 120, y, i * 30); });
    s += `<g transform="translate(130 ${lerp(70, 64, tip)}) rotate(${lerp(0, 32, tip)})">${plate(0, 0, 0.8)}</g>`;
    PAN_SPOTS.slice(5).forEach(([x, y], i) => {
      const q = clamp(slide * 1.4 - i * 0.08), bx = lerp(100 + i * 14, x - 20, q), by = lerp(56, y, q * q);
      s += morsel(F, i, bx, by, i * 50 + q * 120);
    });
    return s + (p > 0.75 ? sizzle(t, 180, 150, 190) : "");
  } },
  // "Transfer to a plate": the spatula lifts food out of the pan onto a plate.
  toplate: { dur: 2.6, draw(t, F) {
    let s = burner(t) + panSide() + plate(296, 84, 0.7);
    const p = t / 2.6, lift = clamp(p / 0.7), arc = Math.sin(lift * Math.PI) * 50;
    const x = lerp(170, 296, ease(lift)), y = lerp(150, 76, ease(lift)) - arc;
    PAN_SPOTS.slice(0, 6).forEach(([px, py], i) => { s += morsel(F, i, px, py, i * 40, 0.9); });
    for (let i = 0; i < 3; i++) s += morsel(F, i + 6, x - 12 + i * 12, y - 8 - (i % 2) * 6, i * 60, 0.9);
    if (p > 0.72) for (let i = 0; i < 3; i++) s += morsel(F, i + 6, 284 + i * 12, 76, i * 60, 0.9);
    return s + spatula(x + 6, y + 2, -18);
  } },
  // "Place in a bowl" / "Add the flour, baking soda, and salt": pieces drop into a bowl.
  intobowl: { dur: 2, draw(t, F) {
    let s = bowlSide("#F6EBD3", `<path d="M78 136 C120 128 240 128 282 136" fill="none" stroke="#E4D6B8" stroke-width="6"/>`);
    for (let i = 0; i < 6; i++) {
      const q = (t / 2 + i / 6) % 1;
      s += morsel(F, i, 150 + (i * 23) % 60, lerp(30, 134, ease(q)), i * 60 + q * 200);

  // "Reduce the heat" / "Turn down to low": the knob turns, the flames shrink.
  heatdown: { dur: 2.4, draw(t, F) {

    s += `<g ${at(310, 70)}><circle r="26" fill="#fff" ${st(3.5)}/><path d="M0 0 L0 -18" ${st(5)} transform="rotate(${lerp(60, -60, p)})"/>${[-60, 0, 60].map(a => `<path d="M0 -32 L0 -36" ${st(3)} transform="rotate(${a})"/>`).join("")}</g>`;
    return s;
  } },
  // "Remove from the heat": the pan slides off and the burner goes out.
  offheat: { dur: 2.6, draw(t, F) {
    const p = ease(clamp(t / 1.6)), off = clamp((t - 1.4) / 0.6);

  // "Push the rice to the side": food sweeps over, leaving room in the pan.
  pushside: { dur: 2.4, draw(t, F) {

  // "Leave untouched for 30 seconds": it sizzles while a stopwatch ticks.
  leave: { dur: 3, draw(t, F) {

  // "Heat a large skillet": an empty pan with heat shimmer.
  heatpan: { dur: 2.4, draw(t) {
    let s = burner(t) + panSide();
    for (let i = 0; i < 4; i++) { const q = (t / 2.4 + i / 4) % 1; s += `<path d="M${120 + i * 40} ${140 - q * 40} c-6 -6 6 -10 0 -16" fill="none" stroke="#E8613C" stroke-width="3" stroke-linecap="round" opacity="${(1 - q) * 0.8}"/>`; }
    return s;
  } },
  // "Warm the milk" in the microwave: the plate turns, the light glows.
  microwave: { dur: 2.4, draw(t, F) {
    let s = `<rect x="50" y="60" width="260" height="150" rx="14" fill="#fff" ${st()}/><rect x="70" y="80" width="170" height="110" rx="8" fill="#FFF3C4" ${st(3)}/>`;
    s += `<rect x="256" y="84" width="38" height="24" rx="4" fill="#DDE7F3" ${st(2.5)}/><circle cx="275" cy="136" r="9" fill="#fff" ${st(2.5)}/><circle cx="275" cy="166" r="9" fill="#fff" ${st(2.5)}/>`;

function cueDemo(name) {
  const [actionName, foodName, shape] = name.split(":");
  const action = ACTIONS[actionName];
  if (!action) return null;
  // "still:bowl:flour,sugar": a place and what sits beside it.
  if (actionName === "still") return { title: name, dur: action.dur, captions: [], draw: (t) => action.draw(t, null, `${foodName || "bowl"}|${shape || ""}`) };
  if (shape) {
    const F0 = FOODS[foodName] || FOODS.food;
    return { title: name, dur: action.dur, captions: [], draw: (t) => action.draw(t, F0, shape) };
  }
  let F = FOODS[foodName];
  if (!F && LIQUIDS[foodName]) F = { ...FOODS.food, type: "round", fill: LIQUIDS[foodName], inner: LIQUIDS[foodName], liquid: LIQUIDS[foodName] };
  F = F || FOODS.food;
  return { title: name, dur: action.dur, captions: [], draw: (t) => action.draw(t, F) };
}

<script>
(function () {

const params = new URLSearchParams(location.search);
